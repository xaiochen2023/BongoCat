[package]
name = "bongo-cat"
version = "0.4.0"
description = "A Tauri App"
authors = [ "ayangweb" ]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bongo_cat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true, features = ["tray-icon", "protocol-asset", "macos-private-api", "image-png"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tauri-plugin-custom-window.workspace = true
rdev = { git = "https://github.com/ayangweb/rdev" }
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-pinia = "3"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-prevent-default = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-macos-permissions = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
fs_extra = "1"
sysinfo = "0.29" # Added for app awareness
reqwest = { version = "0.11", features = ["json", "blocking"] } # Added for Spotify
# serde is already a workspace dependency, ensure features are compatible or specify version here if needed for oauth2
# serde_json is already a workspace dependency
url = "2.3" # Added for Spotify
oauth2 = "4.4" # Added for Spotify (using a recent 4.x)
tiny_http = "0.11" # Added for Spotify callback server
keyring = "2.0" # Added for Spotify token storage
once_cell = "1.10" # Added for Spotify PKCE
rand = "0.8" # Added for Spotify PKCE

[target."cfg(target_os = \"macos\")".dependencies]
tauri-nspanel.workspace = true

[features]
cargo-clippy = []
